name: publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      # The Pi host is an optional peer dependency supplied by the Pi runtime,
      # not a devDependency. Install it ad hoc so typecheck/tests can resolve
      # `@earendil-works/pi-coding-agent` without pinning it in package.json.
      - name: Install Pi host (peer)
        run: npm install --no-save @earendil-works/pi-coding-agent

      - name: Typecheck
        run: npm run typecheck
        env:
          PI_HOST_PACKAGE: "${{ github.workspace }}/node_modules/@earendil-works/pi-coding-agent"

      - name: Test
        run: npm test
        env:
          PI_HOST_PACKAGE: "${{ github.workspace }}/node_modules/@earendil-works/pi-coding-agent"

      - name: Publish
        # Auth is provided by npm Trusted Publishing (OIDC) via the
        # id-token: write permission, so no npm token is required.
        # `--provenance` also attaches a signed build provenance.
        run: npm publish --provenance --access public